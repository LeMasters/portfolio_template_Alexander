# Site settings. Students do not edit this file; their content lives in content/.
# baseURL is replaced at build time by the GitHub Actions workflow.
baseURL = "https://example.github.io/portfolio/"
languageCode = "en-us"
theme = "Alexander"

# Keep the site to the pages we design: no tag/category pages, no RSS.
disableKinds = ["taxonomy", "term", "RSS"]

# Publish robots.txt from the theme's template (AI-training opt-out, sitemap).
enableRobotsTXT = true

[markup.goldmark.renderer]
  # Pages CMS rich-text saves Markdown, but may write a little HTML (e.g. underline).
  unsafe = true

# Images uploaded through Pages CMS land in static/images/. These mounts also hand
# them to Hugo's image processing, so the theme can publish resized WebP copies at
# several widths instead of the (often very large) originals. The originals are not
# published; every image on the site goes through the theme's image partial.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
    excludeFiles = ["images/**"]
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
  [[module.mounts]]
    source = "assets"
    target = "assets"

[imaging]
  quality = 80
  resampleFilter = "Lanczos"

# Experience and Education entries are building blocks of the home page, not pages
# of their own: Hugo reads them but publishes no /experience/ or /education/ pages.
[[cascade]]
  [cascade.build]
    render = "never"
    list = "local"
  [cascade.target]
    path = "{/experience,/experience/**,/education,/education/**}"

# The All projects page (/projects/) is not linked from the home page, which shows
# every project; keep it out of the sitemap so search engines see one list, not two.
[[cascade]]
  [cascade.sitemap]
    disable = true
  [cascade.target]
    kind = "section"
    path = "/projects"
